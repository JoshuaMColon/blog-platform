name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Supabase URL and anon key are public by design (they ship in the browser
# bundle; RLS is what protects data). Repository variables override them.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ghhrqiwrnquyvgpnhhxd.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoaHJxaXdybnF1eXZncG5oaHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODYxNzUsImV4cCI6MjA5NTQ2MjE3NX0.dW0bhLR-fFcOTwABt_lABKDE0sQgPPuSLP44o5h7Amo' }}

jobs:
  checks:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Playwright (local preview build)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
