<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogPlatform · Write, share and discuss</title>
    <meta
      name="description"
      content="A full-stack blogging platform built with React, TypeScript and Supabase: rich-text posts, comments, likes, follows and a guest demo mode."
    />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://blog-platform-one-xi.vercel.app/" />

    <!-- Warm up connections the first screen needs -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font loads without blocking first paint (display=swap shows the fallback meanwhile) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;800&display=swap" /></noscript>

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlogPlatform" />
    <meta property="og:title" content="BlogPlatform · Write, share and discuss" />
    <meta
      property="og:description"
      content="A full-stack blogging platform built with React, TypeScript and Supabase: rich-text posts, comments, likes, follows and a guest demo mode."
    />
    <meta property="og:url" content="https://blog-platform-one-xi.vercel.app/" />
    <meta property="og:image" content="https://blog-platform-one-xi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BlogPlatform: a terminal-inspired blogging app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlogPlatform · Write, share and discuss" />
    <meta
      name="twitter:description"
      content="A full-stack blogging platform built with React, TypeScript and Supabase: rich-text posts, comments, likes, follows and a guest demo mode."
    />
    <meta name="twitter:image" content="https://blog-platform-one-xi.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
